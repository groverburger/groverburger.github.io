    html {

      background-image: linear-gradient(#222 2px, transparent 2px), linear-gradient(90deg, #222 2px, transparent 2px);

    @keyframes scrollBackgroundA {
      from {
        background-position: 0 0;
      }
      to {
        background-position: 512px 512px;
      }
    }

    @keyframes scrollBackgroundB {
      from {
        background-position: 0 0;
      }
      to {

    @font-face {
      font-family: 'BMItalic';

    p {
      margin-top: 2rem;
    }

    .noiseA {
      position: absolute;
      background-image: url('./purple_nebula_1.png');
      animation: scrollBackgroundA 120s linear infinite;
      transform: scale(2);
      opacity: 0.6;
      width: 100vw;
      height: 100vh;
    }

    .noiseB {
      position: absolute;
      background-image: url('./noise.png');
      animation: scrollBackgroundB 80s linear infinite;
      opacity: 0.1;
      width: 100vw;
      height: 100vh;
    }

    body {

    a:hover, a:active { color: #7C97EF }

    a svg {
